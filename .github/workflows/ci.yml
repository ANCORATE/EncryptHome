name: CI

on:
  push:
    branches: [main, master, dev, beta]
  pull_request:
    branches: [main, master, dev, beta]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 cryptography argon2-cffi requests pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: pytest -q