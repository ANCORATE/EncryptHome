name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: EncryptHome-Windows.exe
            sep: ";"
          - os: macos-latest
            artifact: EncryptHome-macOS
            sep: ":"
          - os: ubuntu-latest
            artifact: EncryptHome-Linux
            sep: ":"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 cryptography argon2-cffi requests pytest pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: pytest -q

      - name: Build executable
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --onefile --name EncryptHome main.py \
            --collect-all PyQt6 \
            --add-data "utilities${{ matrix.sep }}utilities" \
            --add-data "docs${{ matrix.sep }}docs" \
            --add-data "TOS.txt${{ matrix.sep }}." \
            --add-data "README.md${{ matrix.sep }}."

      - name: Prepare artifact
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/EncryptHome.exe "${{ matrix.artifact }}"
          else
            cp dist/EncryptHome "${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create source archive
        run: git archive --format=zip --output=EncryptHome-${{ github.ref_name }}-source.zip HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            EncryptHome-${{ github.ref_name }}-source.zip
          generate_release_notes: false
          body: |
            Release ${{ github.ref_name }} of EncryptHome.

            Includes Windows, macOS, and Linux binaries.