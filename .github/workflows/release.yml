name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: EncryptHome-Windows.exe
            sep: ";"
            icon: '--icon "utilities/assets/app/icon.ico"'
          - os: macos-latest
            artifact: EncryptHome-macOS
            sep: ":"
            icon: ""
          - os: ubuntu-latest
            artifact: EncryptHome-Linux
            sep: ":"
            icon: ""

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 cryptography argon2-cffi requests pytest pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: pytest -q

      - name: Build executable
        shell: bash
        run: |
          args=(--noconfirm --windowed --onefile --name EncryptHome main.py)
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            args+=(--icon utilities/assets/app/icon.ico)
          fi
          args+=(--collect-all PyQt6)
          args+=(--add-data "utilities${{ matrix.sep }}utilities")
          args+=(--add-data "docs${{ matrix.sep }}docs")
          args+=(--add-data "TOS.txt${{ matrix.sep }}.")
          args+=(--add-data "README.md${{ matrix.sep }}.")
          pyinstaller "${args[@]}"

      - name: Prepare artifact
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/EncryptHome.exe "${{ matrix.artifact }}"
          else
            cp dist/EncryptHome "${{ matrix.artifact }}"
          fi

      - name: Prepare installer data (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          copy TOS.txt dist\TOS.txt

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: iscc EncryptHome.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: EncryptHome-Setup.exe
          path: dist/setup_output/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create source archive
        run: git archive --format=zip --output=EncryptHome-${{ github.ref_name }}-source.zip HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            EncryptHome-${{ github.ref_name }}-source.zip
          generate_release_notes: false
          body: |
            Release ${{ github.ref_name }} of EncryptHome.

            Changes:
            - Beta release for the 27.1 stability and UX cycle
            - Removed obsolete EncryptPro/Discovery references
            - Fixed crash on exit caused by late update-check signals
            - In-app updater now uses the installer for protected install directories
            - Per-user installer defaults for writable self-updates
            - Clearer update status and install flow in settings
            - Update integrity checks remain enforced before installation

            Includes Windows, macOS, and Linux binaries.